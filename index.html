<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Crimson Garden</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050102;
    color: #f7d8d8;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    touch-action: manipulation;
}

button {
    font: inherit;
}

/* =========================
   GARDEN
========================= */

#garden {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 22%,
            rgba(150, 0, 20, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 105%,
            rgba(120, 0, 15, 0.22),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #070305 0%,
            #110306 48%,
            #040102 100%
        );
}

#garden::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0, 0, 0, 0.7) 100%
        );

    z-index: 8;
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;
    top: 7vh;
    left: 50%;

    transform: translateX(-50%);

    width: min(25vw, 145px);
    height: min(25vw, 145px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff8ef 0 15%,
            #ffdede 48%,
            #dca5a5 100%
        );

    box-shadow:
        0 0 35px rgba(255, 170, 170, 0.35),
        0 0 100px rgba(150, 0, 30, 0.16);

    opacity: 0.8;
    z-index: 1;
}

.moon::after {
    content: "";
    position: absolute;
    inset: 8%;

    border-radius: 50%;

    box-shadow:
        inset -18px -12px 30px rgba(80, 0, 20, 0.18);
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;
    top: 4.5%;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 10;
    width: 90%;

    pointer-events: none;
}

.title h1 {
    margin: 0;

    font-size: clamp(25px, 5vw, 52px);

    letter-spacing: 0.14em;
    text-transform: uppercase;

    color: #f3c7c7;

    text-shadow:
        0 0 18px rgba(255, 30, 60, 0.35);
}

.title p {
    margin: 8px 0 0;

    color: #bc858b;

    font-size: clamp(12px, 2.2vw, 16px);

    letter-spacing: 0.08em;
}

/* =========================
   MIST
========================= */

.mist {
    position: absolute;

    left: -20%;
    width: 140%;
    height: 18vh;

    filter: blur(18px);

    opacity: 0.12;

    background: rgba(235, 180, 180, 0.35);

    border-radius: 50%;

    z-index: 6;

    pointer-events: none;
}

.m1 {
    bottom: 20%;

    animation:
        drift 18s ease-in-out infinite alternate;
}

.m2 {
    bottom: 5%;

    opacity: 0.09;

    animation:
        drift 24s ease-in-out infinite alternate-reverse;
}

@keyframes drift {
    from {
        transform: translateX(-6%);
    }

    to {
        transform: translateX(8%);
    }
}

/* =========================
   PARTICLES
========================= */

#particles,
#petals {
    position: absolute;
    inset: 0;

    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #ff5265;

    box-shadow:
        0 0 7px #ff263f;

    opacity: 0.5;

    animation:
        float linear infinite;
}

@keyframes float {

    0% {
        transform:
            translateY(105vh)
            translateX(0);

        opacity: 0;
    }

    15% {
        opacity: 0.65;
    }

    85% {
        opacity: 0.45;
    }

    100% {
        transform:
            translateY(-10vh)
            translateX(35px);

        opacity: 0;
    }
}

/* =========================
   FALLING PETALS
========================= */

.petal {
    position: absolute;

    width: 10px;
    height: 5px;

    background: #9c1426;

    border-radius:
        100% 0 100% 0;

    box-shadow:
        0 0 7px rgba(255, 30, 60, 0.25);

    animation:
        fall linear forwards;
}

@keyframes fall {

    0% {
        transform:
            translate3d(0, -10vh, 0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    50% {
        transform:
            translate3d(35px, 50vh, 0)
            rotate(180deg);
    }

    100% {
        transform:
            translate3d(-30px, 110vh, 0)
            rotate(420deg);

        opacity: 0;
    }
}

/* =========================
   FLOWERS
========================= */

#flowers {
    position: absolute;
    inset: 0;

    z-index: 7;
}

.flower {
    position: absolute;

    width: 90px;
    height: 90px;

    border: 0;

    background: transparent;

    cursor: pointer;

    transform:
        translate(-50%, -50%);

    filter:
        drop-shadow(
            0 0 8px rgba(210, 0, 30, 0.25)
        );

    transition:
        filter 0.35s,
        opacity 0.7s,
        transform 0.25s;
}

.flower:hover {
    filter:
        drop-shadow(
            0 0 18px rgba(255, 20, 50, 0.65)
        );

    transform:
        translate(-50%, -50%)
        scale(1.08);
}

.flower:active {
    transform:
        translate(-50%, -50%)
        scale(0.94);
}

.flower.gone {
    pointer-events: none;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0.25);
}

/* STEM */

.stem {
    position: absolute;

    width: 3px;
    height: 90px;

    left: 50%;
    top: 57px;

    background:
        linear-gradient(
            #7c1725,
            #172b17
        );

    transform:
        rotate(var(--lean));

    transform-origin: top;

    border-radius: 3px;
}

/* BLOOM */

.bloom {
    position: absolute;

    left: 50%;
    top: 35px;

    width: 65px;
    height: 65px;

    transform:
        translate(-50%, -50%);

    animation:
        sway 4s ease-in-out infinite;

    transition: filter 0.3s;
}

@keyframes sway {

    50% {
        transform:
            translate(-50%, -50%)
            rotate(3deg);
    }
}

/* PETALS */

.p {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 8px;
    height: 34px;

    background:
        linear-gradient(
            90deg,
            #8b1022,
            #ef2945 45%,
            #741020
        );

    border-radius:
        90% 20% 90% 20%;

    transform-origin:
        50% 100%;

    box-shadow:
        0 0 7px rgba(255, 25, 55, 0.35);
}

.p:nth-child(1) {
    transform:
        translate(-50%, -100%)
        rotate(0deg);
}

.p:nth-child(2) {
    transform:
        translate(-50%, -100%)
        rotate(45deg);
}

.p:nth-child(3) {
    transform:
        translate(-50%, -100%)
        rotate(90deg);
}

.p:nth-child(4) {
    transform:
        translate(-50%, -100%)
        rotate(135deg);
}

.p:nth-child(5) {
    transform:
        translate(-50%, -100%)
        rotate(180deg);
}

.p:nth-child(6) {
    transform:
        translate(-50%, -100%)
        rotate(225deg);
}

.p:nth-child(7) {
    transform:
        translate(-50%, -100%)
        rotate(270deg);
}

.p:nth-child(8) {
    transform:
        translate(-50%, -100%)
        rotate(315deg);
}

/* CENTER */

.stamens {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    background: #ffd0a8;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 8px #ff8a66;
}

/* CORRECT FLOWER */

.flower.correct .bloom {

    filter:
        drop-shadow(
            0 0 20px #ff1838
        );

    animation:
        open 1.2s ease forwards;
}

@keyframes open {

    to {
        transform:
            translate(-50%, -50%)
            scale(1.28)
            rotate(0deg);

        filter:
            drop-shadow(
                0 0 30px #ff1838
            );
    }
}

/* =========================
   MINI LETTER
========================= */

.letter-mini {

    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    width: 24px;
    height: 17px;

    background: #f0d8c5;

    border:
        1px solid #8e5b53;

    transform:
        translate(-50%, -50%)
        rotate(-4deg);

    box-shadow:
        0 0 15px rgba(255, 210, 190, 0.8);

    z-index: 3;
}

.flower.correct .letter-mini {

    display: block;

    animation:
        pop 0.8s 0.7s both;
}

@keyframes pop {

    from {
        opacity: 0;

        transform:
            translate(-50%, -40%)
            scale(0.3)
            rotate(-15deg);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(-4deg);
    }
}

/* =========================
   MESSAGES
========================= */

#message {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    z-index: 10;

    text-align: center;

    color: #b9848b;

    font-size: 13px;

    letter-spacing: 0.06em;

    opacity: 0.8;

    transition:
        opacity 0.3s;
}

#message.show {
    opacity: 1;
}

#hint {

    position: absolute;

    left: 50%;
    bottom: 3%;

    transform:
        translateX(-50%);

    z-index: 10;

    color: #6e4249;

    font-size: 11px;

    letter-spacing: 0.1em;

    white-space: nowrap;
}

/* =========================
   LETTER SCENE
========================= */

#letterScene {

    position: absolute;
    inset: 0;

    z-index: 30;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(2, 0, 1, 0.86);

    backdrop-filter:
        blur(6px);

    opacity: 0;

    transition:
        opacity 0.8s;
}

#letterScene.open {

    display: flex;

    opacity: 1;
}

/* PAPER */

.paper {

    position: relative;

    width: min(88vw, 650px);

    max-height: 82vh;

    overflow: auto;

    padding:
        clamp(25px, 5vw, 55px);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.12),
            transparent 25%
        ),
        #ead7c5;

    color: #34151a;

    border-radius: 3px;

    box-shadow:
        0 0 0 1px rgba(255,220,200,0.2),
        0 25px 80px rgba(0,0,0,0.7),
        0 0 50px rgba(180,0,30,0.25);

    transform:
        perspective(900px)
        rotateX(-90deg)
        scale(0.7);

    transform-origin:
        top center;

    animation:
        unfold 1.4s cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes unfold {

    to {

        transform:
            perspective(900px)
            rotateX(0)
            scale(1);
    }
}

.paper::before {

    content: "";

    position: absolute;

    inset: 10px;

    border:
        1px solid rgba(100,35,35,0.18);

    pointer-events: none;
}

.paper h2 {

    margin:
        0 0 20px;

    text-align: center;

    font-size:
        clamp(20px, 4vw, 30px);

    letter-spacing:
        0.12em;

    text-transform:
        uppercase;

    color:
        #6e1823;
}

.paper p {

    font-size:
        clamp(15px, 2.5vw, 18px);

    line-height:
        1.75;

    margin: 0;

    white-space: pre-line;
}

.closeLetter {

    display: block;

    margin:
        28px auto 0;

    border:
        1px solid #8b3b45;

    background:
        #4b1019;

    color:
        #f5d6d2;

    padding:
        10px 20px;

    border-radius: 2px;

    cursor: pointer;

    letter-spacing:
        0.08em;
}

.closeLetter:hover {

    background:
        #681522;
}

/* =========================
   ENDING
========================= */

#ending {

    position: absolute;

    inset: 0;

    z-index: 40;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(95,0,15,0.28),
            rgba(2,0,1,0.96) 70%
        );

    opacity: 0;

    transition:
        opacity 1s;
}

#ending.show {

    display: flex;

    opacity: 1;
}

.endInner {

    width:
        min(90%, 650px);
}

.endInner h2 {

    font-size:
        clamp(24px, 5vw, 46px);

    color:
        #f1c5c5;

    text-shadow:
        0 0 20px rgba(255,20,50,0.35);

    margin:
        0 0 18px;
}

.endInner p {

    font-size:
        clamp(15px, 2.8vw, 20px);

    color:
        #b47d84;

    line-height:
        1.6;
}

.restart {

    margin-top: 18px;

    background: transparent;

    border:
        1px solid #6f2833;

    color:
        #b77f87;

    padding:
        9px 16px;

    cursor: pointer;
}

/* =========================
   FOLD ANIMATION
========================= */

@keyframes fold {

    to {

        transform:
            perspective(900px)
            rotateX(-90deg)
            scale(0.7);

        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .flower {
        width: 75px;
        height: 75px;
    }

    .bloom {
        transform:
            translate(-50%, -50%)
            scale(0.85);
    }

    .flower:hover {
        transform:
            translate(-50%, -50%);
    }

    #hint {
        font-size: 9px;
    }

    .paper {
        max-height: 84vh;
    }
}
</style>
</head>

<body>

<main id="garden">

    <div class="moon"></div>

    <div class="title">
        <h1>The Crimson Garden</h1>

        <p>
            Somewhere among the flowers,
            something is waiting.
        </p>
    </div>

    <div class="mist m1"></div>
    <div class="mist m2"></div>

    <div id="particles"></div>
    <div id="petals"></div>
    <div id="flowers"></div>

    <div id="message"></div>

    <div id="hint">
        TAP THE FLOWERS · ONE OF THEM IS DIFFERENT
    </div>


    <!-- LETTER -->

    <section
        id="letterScene"
        aria-hidden="true"
    >

        <article class="paper">

            <h2>
                A little something...
            </h2>

            <p id="letterText"></p>

            <button
                class="closeLetter"
                id="closeLetter"
            >
                Fold the letter
            </button>

        </article>

    </section>


    <!-- ENDING -->

    <section id="ending">

        <div class="endInner">

            <h2>
                Congratulations.
            </h2>

            <p>
                You found the only flower that mattered.
                <br><br>

                <em>
                    ...don't get too proud though.
                    I'm still cooler. ;)
                </em>
            </p>

            <button
                class="restart"
                id="restart"
            >
                Return to the garden
            </button>

        </div>

    </section>

</main>


<script>

/* =========================================
   YOUR LETTER
========================================= */

const letter = `This is how I win. I could've just given you flowers like a normal person, but apparently that's way too easy for me. So obviously I had to make an entire little world just so you could get this message. Honestly, you should feel special. I don't put this much effort into just anybody. Okay, maybe I'm showing off a little. But can you really blame me? I just wanted to make you smile. Something a little ridiculous, a little dramatic, and very obviously me. So yeah... The flowers are pretty. The whole thing is kinda cool. But let's be honest... I'm still the best part. ;) Anyway, I hope this made you smile. You're genuinely one of those people I'm really glad I got to know. Don't let that get to your head though. I'm still cooler. — YOUR FAVORITE FRIEND ;)`;


/* =========================================
   ELEMENTS
========================================= */

const flowersEl =
    document.getElementById("flowers");

const petalsEl =
    document.getElementById("petals");

const particlesEl =
    document.getElementById("particles");

const messageEl =
    document.getElementById("message");

const letterScene =
    document.getElementById("letterScene");

const letterText =
    document.getElementById("letterText");

const ending =
    document.getElementById("ending");

const hint =
    document.getElementById("hint");


/* =========================================
   GAME VARIABLES
========================================= */

let correctIndex = 0;
let found = false;


/* =========================================
   RANDOM NUMBER
========================================= */

function rand(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


/* =========================================
   PARTICLES
========================================= */

function makeParticles() {

    particlesEl.innerHTML = "";

    for (let i = 0; i < 55; i++) {

        const particle =
            document.createElement("i");

        particle.className =
            "particle";

        particle.style.left =
            rand(0, 100) + "%";

        particle.style.animationDuration =
            rand(7, 18) + "s";

        particle.style.animationDelay =
            rand(-18, 0) + "s";

        particle.style.opacity =
            rand(0.2, 0.65);

        particlesEl.appendChild(
            particle
        );
    }
}


/* =========================================
   FALLING PETALS
========================================= */

function makePetal() {

    const petal =
        document.createElement("i");

    petal.className =
        "petal";

    petal.style.left =
        rand(0, 100) + "%";

    petal.style.animationDuration =
        rand(6, 12) + "s";

    petal.style.animationDelay =
        rand(-3, 0) + "s";

    petal.style.transform =
        `rotate(${rand(0, 360)}deg)`;

    petal.addEventListener(
        "animationend",
        () => petal.remove()
    );

    petalsEl.appendChild(
        petal
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text) {

    messageEl.textContent =
        text;

    messageEl.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(() => {

            messageEl.classList.remove(
                "show"
            );

        }, 1200);
}


/* =========================================
   CREATE FLOWER
========================================= */

function createFlower(index) {

    const flower =
        document.createElement("button");

    flower.className =
        "flower";

    flower.setAttribute(
        "aria-label",
        "Mysterious spider lily"
    );


    /*
       Random positioning
    */

    flower.style.left =
        rand(8, 92) + "%";

    flower.style.top =
        rand(22, 86) + "%";

    flower.style.setProperty(
        "--lean",
        rand(-8, 8) + "deg"
    );

    flower.style.zIndex =
        Math.floor(rand(1, 7));


    /*
       Flower HTML
    */

    flower.innerHTML = `

        <span class="stem"></span>

        <span class="bloom">

            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>
            <i class="p"></i>

            <i class="stamens"></i>

            <i class="letter-mini"></i>

        </span>
    `;


    /*
       CLICK FLOWER
    */

    flower.addEventListener(
        "click",
        () => {

            if (
                found ||
                flower.classList.contains("gone")
            ) {
                return;
            }


            /*
               CORRECT FLOWER
            */

            if (index === correctIndex) {

                found = true;

                flower.classList.add(
                    "correct"
                );

                showMessage(
                    "...you found something."
                );

                hint.textContent =
                    "THE FLOWER HAS REVEALED ITS SECRET";


                /*
                   Extra petals
                */

                for (let i = 0; i < 10; i++) {

                    setTimeout(
                        makePetal,
                        i * 100
                    );
                }


                /*
                   Reveal letter
                */

                setTimeout(() => {

                    const mini =
                        flower.querySelector(
                            ".letter-mini"
                        );

                    mini.style.cursor =
                        "pointer";

                    mini.addEventListener(
                        "click",
                        openLetter,
                        { once: true }
                    );

                    showMessage(
                        "Tap the little letter."
                    );

                }, 1000);

            }


            /*
               WRONG FLOWER
            */

            else {

                flower.classList.add(
                    "gone"
                );

                showMessage(
                    "Not this one…"
                );


                /*
                   Drop petals
                */

                for (let i = 0; i < 5; i++) {

                    setTimeout(
                        makePetal,
                        i * 90
                    );
                }
            }
        }
    );


    flowersEl.appendChild(
        flower
    );
}


/* =========================================
   BUILD GARDEN
========================================= */

function buildGarden() {

    flowersEl.innerHTML = "";

    found = false;

    /*
       Randomly choose
       the secret flower
    */

    correctIndex =
        Math.floor(
            Math.random() * 14
        );


    /*
       Create 14 flowers
    */

    for (let i = 0; i < 14; i++) {

        createFlower(i);
    }


    hint.textContent =
        "TAP THE FLOWERS · ONE OF THEM IS DIFFERENT";
}


/* =========================================
   OPEN LETTER
========================================= */

function openLetter(event) {

    if (event) {

        event.stopPropagation();
    }


    letterScene.style.display =
        "flex";


    requestAnimationFrame(() => {

        letterScene.classList.add(
            "open"
        );

    });


    letterScene.setAttribute(
        "aria-hidden",
        "false"
    );


    /*
       Clear old text
    */

    letterText.textContent =
        "";


    /*
       Reveal letter gradually
    */

    let position = 0;

    function reveal() {

        if (position < letter.length) {

            letterText.textContent +=
                letter.slice(
                    position,
                    position + 4
                );

            position += 4;

            setTimeout(
                reveal,
                12
            );
        }
    }


    setTimeout(
        reveal,
        700
    );
}


/* =========================================
   CLOSE LETTER
========================================= */

document
    .getElementById("closeLetter")
    .addEventListener(
        "click",
        () => {

            const paper =
                document.querySelector(
                    ".paper"
                );


            /*
               Fold animation
            */

            paper.style.animation =
                "none";

            paper.offsetHeight;

            paper.style.animation =
                "fold 0.8s ease forwards";


            setTimeout(() => {

                letterScene.classList.remove(
                    "open"
                );

                letterScene.style.display =
                    "none";


                /*
                   Show ending
                */

                ending.classList.add(
                    "show"
                );

            }, 650);
        }
    );


/* =========================================
   RESTART
========================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            ending.classList.remove(
                "show"
            );

            setTimeout(
                buildGarden,
                700
            );
        }
    );


/* =========================================
   START
========================================= */

makeParticles();

buildGarden();


/*
   Continuously spawn petals
*/

setInterval(
    makePetal,
    850
);

</script>

</body>
</html>
